<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Deep Dark Background with Radial Caustic Ambient Gradients -->
  <rect width="400" height="400" fill="#0A0D1F"/>
  <circle cx="200" cy="180" r="160" fill="url(#ambient_purple)" opacity="0.6"/>
  <circle cx="280" cy="260" r="120" fill="url(#ambient_cyan)" opacity="0.4"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="0.8">
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
  </g>

  <!-- Central Silhouette & Glass Shield -->
  <circle cx="200" cy="200" r="130" fill="url(#inner_glow)" stroke="url(#ring_stroke)" stroke-width="2.5"/>

  <!-- Code Bracket Graphics -->
  <path d="M125 155L90 195L125 235" stroke="url(#accent_grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M275 155L310 195L275 235" stroke="url(#accent_grad2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Monogram Monolith: TK -->
  <text x="200" y="215" text-anchor="middle" fill="#FFFFFF" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-size="78" font-weight="800" letter-spacing="-2">
    TK
  </text>

  <!-- Subtitle Tag -->
  <g transform="translate(115, 252)">
    <rect width="170" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="14" cy="13" r="3.5" fill="#34D399"/>
    <text x="26" y="17" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">TED KHALWALE</text>
  </g>

  <!-- Linear & Radial Gradients -->
  <defs>
    <radialGradient id="ambient_purple" cx="50%" cy="50%" r="50%">
      <stop stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient_cyan" cx="50%" cy="50%" r="50%">
      <stop stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inner_glow" cx="50%" cy="40%" r="60%">
      <stop stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="ring_stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="accent_grad" x1="90" y1="155" x2="125" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="accent_grad2" x1="275" y1="155" x2="310" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
</svg>
