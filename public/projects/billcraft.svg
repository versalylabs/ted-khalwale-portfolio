<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Window Background -->
  <rect width="800" height="500" rx="16" fill="#0A0E1F"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top Nav -->
  <rect width="800" height="48" fill="#060916" rx="16 16 0 0"/>
  <circle cx="24" cy="24" r="5" fill="#EF4444"/>
  <circle cx="40" cy="24" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="24" r="5" fill="#10B981"/>
  <text x="80" y="28" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">BillCraft — Invoice #INV-2024-089</text>
  <rect x="660" y="14" width="116" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
  <text x="676" y="29" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">✓ PDF READY</text>

  <!-- Left Invoice Sheet Preview -->
  <g transform="translate(30, 68)">
    <rect width="480" height="400" rx="12" fill="#FFFFFF" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))"/>
    
    <!-- Invoice Header inside Sheet -->
    <text x="32" y="44" fill="#0F172A" font-family="'Syne', sans-serif" font-size="20" font-weight="800">INVOICE</text>
    <text x="32" y="62" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">INV-2024-089 · Issued: 12 Oct 2024</text>

    <!-- Billed To -->
    <text x="32" y="100" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">BILLED TO:</text>
    <text x="32" y="118" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Apex Global Logistics Ltd</text>
    <text x="32" y="134" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Nairobi, Kenya</text>

    <!-- Line items table -->
    <rect x="32" y="156" width="416" height="26" fill="#F1F5F9" rx="4"/>
    <text x="44" y="173" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10">DESCRIPTION</text>
    <text x="260" y="173" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10">HOURS</text>
    <text x="330" y="173" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10">RATE</text>
    <text x="400" y="173" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10">TOTAL</text>

    <text x="44" y="206" fill="#1E293B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Custom Inventory System Architecture</text>
    <text x="260" y="206" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">40</text>
    <text x="330" y="206" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">$75</text>
    <text x="400" y="206" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">$3,000</text>
    <line x1="32" y1="220" x2="448" y2="220" stroke="#E2E8F0"/>

    <text x="44" y="246" fill="#1E293B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">POS Terminal Integration &amp; Testing</text>
    <text x="260" y="246" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">24</text>
    <text x="330" y="246" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">$75</text>
    <text x="400" y="246" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">$1,800</text>
    <line x1="32" y1="260" x2="448" y2="260" stroke="#E2E8F0"/>

    <!-- Totals -->
    <g transform="translate(260, 280)">
      <text x="0" y="16" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">Subtotal:</text>
      <text x="140" y="16" text-anchor="end" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="11">$4,800.00</text>
      <text x="0" y="38" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">VAT (16%):</text>
      <text x="140" y="38" text-anchor="end" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="11">$768.00</text>
      <line x1="0" y1="52" x2="140" y2="52" stroke="#CBD5E1"/>
      <text x="0" y="74" fill="#4338CA" font-family="'Syne', sans-serif" font-size="14" font-weight="800">Total Due:</text>
      <text x="140" y="74" text-anchor="end" fill="#4338CA" font-family="'Syne', sans-serif" font-size="15" font-weight="800">$5,568.00</text>
    </g>
  </g>

  <!-- Right Quick Actions & Summary -->
  <g transform="translate(530, 68)">
    <rect width="240" height="400" rx="12" fill="#0E1328" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="32" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="14" font-weight="700">Billing Lifecycle</text>
    
    <!-- Status badge -->
    <rect x="20" y="48" width="80" height="24" rx="6" fill="rgba(16,185,129,0.2)"/>
    <text x="32" y="64" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PAID IN FULL</text>

    <!-- Multi Currency Switcher -->
    <g transform="translate(20, 96)">
      <text x="0" y="14" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">CURRENCY CONVERSION</text>
      <rect y="22" width="200" height="32" rx="8" fill="#141A38" stroke="rgba(255,255,255,0.08)"/>
      <text x="12" y="42" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11">KES ≈ 723,840.00</text>
    </g>

    <!-- Quick action buttons -->
    <rect x="20" y="180" width="200" height="36" rx="8" fill="#4F46E5"/>
    <text x="120" y="202" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Download PDF</text>

    <rect x="20" y="228" width="200" height="36" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
    <text x="120" y="250" text-anchor="middle" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">Send Payment Reminder</text>

    <rect x="20" y="276" width="200" height="36" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
    <text x="120" y="298" text-anchor="middle" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">Copy Shareable Link</text>
  </g>
</svg>
